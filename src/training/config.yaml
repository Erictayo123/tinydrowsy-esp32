# TinyDrowsy Training Configuration
# ================================

# Dataset
dataset:
  root: "dataset/processed"
  image_size: 64
  channels: 1

# Training
training:
  batch_size: 64
  num_epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  random_seed: 42

# Model
model:
  name: "TinyEyeNetV2"
  num_classes: 2
  input_channels: 1

# Output
output:
  dir: "training_output"
  save_best: true
  save_checkpoints: true
  log_tensorboard: false

# Device
device: "cuda"  # auto-detected if not set